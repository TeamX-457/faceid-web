<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guidian AI - Students</title>
  <script>(function(){try{document.documentElement.setAttribute('data-theme', localStorage.getItem('gd_theme')||'dark');}catch(e){}})();</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235b9bd5'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='19' font-weight='700' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    thead th { text-align: left; padding: 0.65rem 1rem; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-dim); background: var(--bg-panel-raised); border-bottom: 1px solid var(--line); }
    tbody td { padding: 0.65rem 1rem; border-top: 1px solid var(--line); }
    .link-btn { background: none; border: none; font-family: var(--font-ui); font-size: 0.8rem; font-weight: 500; cursor: pointer; padding: 0; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="rail-mount"></div>
    <div class="shell-main">
      <header class="shell-topbar">
        <span class="hud-brand" style="font-size:0.9rem;"><span class="dot"></span>Student Roster</span>
        <span id="user-label" class="hud-user"></span>
      </header>
      <main class="shell-content" style="max-width:1100px; margin:0 auto; width:100%;">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.25rem;">
      <h1 class="hud-h1">Student Roster</h1>
      <input id="search" type="text" placeholder="Search by name..." class="hud-input" style="width:260px;" />
      <button id="add-btn" class="hud-btn">+ Add Student</button>
    </div>

    <div id="add-form" class="hidden hud-panel" style="padding:1.1rem; margin-bottom:1.25rem;">
      <h2 style="font-size:0.85rem; font-weight:600; margin:0 0 0.9rem;">Enroll New Student</h2>
      <form id="enroll-form" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:0.9rem; align-items:end;">
        <div>
          <label class="hud-label">Full Name</label>
          <input id="enroll-name" required class="hud-input" style="margin-top:0.35rem;" />
        </div>
        <div>
          <label class="hud-label">Class</label>
          <input id="enroll-class" required class="hud-input" style="margin-top:0.35rem;" />
        </div>
        <div>
          <label class="hud-label">Photo</label>
          <input id="enroll-photo" type="file" accept="image/*" required style="margin-top:0.5rem; font-size:0.8rem; color:var(--text-dim); width:100%;" />
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button type="submit" class="hud-btn" style="flex:1;">Enroll</button>
          <button type="button" id="cancel-add" class="hud-btn-ghost" style="flex:1;">Cancel</button>
        </div>
      </form>
    </div>

    <div id="loading" style="color:var(--text-dim); font-size:0.85rem; margin-bottom:0.75rem;">Loading students...</div>
    <div class="hud-panel" style="overflow:hidden;">
      <table>
        <thead>
          <tr>
            <th>Full Name</th>
            <th>Class</th>
            <th>Enrolled</th>
            <th style="text-align:right;">Actions</th>
          </tr>
        </thead>
        <tbody id="student-rows"></tbody>
      </table>
    </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const session = requireRole("ADMIN");
    renderIconRail("students");
    initThemeToggle();
    document.getElementById("user-label").textContent = `${session.fullName} (${session.role})`;

    let students = [];

    function renderStudents() {
      const query = document.getElementById("search").value.trim().toLowerCase();
      const filtered = students.filter((s) => s.fullName.toLowerCase().includes(query));

      document.getElementById("student-rows").innerHTML = filtered
        .map(
          (s) => `
        <tr data-row="${s.id}">
          <td>${s.fullName}</td>
          <td style="color:var(--text-dim);">${s.studentClass}</td>
          <td style="color:var(--text-dim); font-family:var(--font-mono); font-size:0.78rem;">${formatDate(s.enrollmentDate)}</td>
          <td style="text-align:right;">
            <button data-id="${s.id}" class="edit-btn link-btn" style="color:var(--accent); margin-right:1rem;">Edit</button>
            <button data-id="${s.id}" class="delete-btn link-btn" style="color:var(--red);">Delete</button>
          </td>
        </tr>`
        )
        .join("");

      document.querySelectorAll(".edit-btn").forEach((btn) => btn.addEventListener("click", () => editStudent(btn.dataset.id)));
      document.querySelectorAll(".delete-btn").forEach((btn) => btn.addEventListener("click", () => deleteStudent(btn.dataset.id)));
    }

    async function loadStudents() {
      try {
        students = await apiFetch("/api/v1/students");
        document.getElementById("loading").classList.add("hidden");
        renderStudents();
      } catch (err) {
        document.getElementById("loading").textContent = "Failed to load students: " + err.message;
      }
    }

    async function editStudent(id) {
      const student = students.find((s) => String(s.id) === String(id));
      const fullName = prompt("Full name:", student.fullName);
      if (fullName === null) return;
      const studentClass = prompt("Class:", student.studentClass);
      if (studentClass === null) return;
      try {
        await apiFetch(`/api/v1/students/${id}`, { method: "PUT", body: { fullName, studentClass } });
        showToast("Student updated");
        await loadStudents();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    async function deleteStudent(id) {
      if (!confirm("Remove this student from the roster?")) return;
      try {
        await apiFetch(`/api/v1/students/${id}`, { method: "DELETE" });
        showToast("Student deleted");
        await loadStudents();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    document.getElementById("search").addEventListener("input", renderStudents);

    const addForm = document.getElementById("add-form");
    document.getElementById("add-btn").addEventListener("click", () => addForm.classList.toggle("hidden"));
    document.getElementById("cancel-add").addEventListener("click", () => addForm.classList.add("hidden"));

    document.getElementById("enroll-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append("full_name", document.getElementById("enroll-name").value);
      formData.append("student_class", document.getElementById("enroll-class").value);
      formData.append("enrollment_photo", document.getElementById("enroll-photo").files[0]);

      try {
        await apiFetch("/api/v1/students", { method: "POST", formData });
        showToast("Student enrolled");
        e.target.reset();
        addForm.classList.add("hidden");
        await loadStudents();
      } catch (err) {
        showToast(err.message, true);
      }
    });

    loadStudents();
  </script>
</body>
</html>
