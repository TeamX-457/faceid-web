<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guidian AI - Upload Incident</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <nav class="bg-slate-900 text-white px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-8">
      <span class="font-bold">Guidian AI</span>
      <span class="text-sm font-medium border-b-2 border-white pb-1">Upload Incident</span>
    </div>
    <div class="flex items-center gap-4 text-sm">
      <span id="user-label" class="text-slate-300"></span>
      <button onclick="logout()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg">Logout</button>
    </div>
  </nav>

  <main class="max-w-xl mx-auto p-6">
    <div class="bg-white border border-slate-200 rounded-xl p-6">
      <h1 class="text-lg font-bold text-slate-900 mb-1">Submit Incident Footage</h1>
      <p class="text-sm text-slate-500 mb-4">Upload a photo. It will be run through face detection and matched against the enrolled student roster.</p>

      <form id="upload-form" class="space-y-3">
        <input id="file-input" type="file" accept="image/*" required class="w-full text-sm" />
        <button id="submit-btn" type="submit" class="w-full bg-slate-900 text-white text-sm font-semibold rounded-lg py-2 hover:bg-slate-800">
          Upload &amp; Analyze
        </button>
      </form>
    </div>

    <div id="result" class="hidden mt-4 bg-white border border-slate-200 rounded-xl p-6">
      <h2 class="text-sm font-semibold text-slate-900 mb-3">Detection Result</h2>
      <div id="result-body" class="space-y-2 text-sm text-slate-700"></div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    const session = requireRole("UPLOADER");
    document.getElementById("user-label").textContent = `${session.fullName} (${session.role})`;

    document.getElementById("upload-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = document.getElementById("file-input").files[0];
      if (!file) return;

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Analyzing...";

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await apiFetch("/api/v1/incidents/upload", { method: "POST", formData });
        const resultBox = document.getElementById("result");
        const body = document.getElementById("result-body");
        const matches = res.matches || [];

        body.innerHTML =
          `<p><span class="font-medium">Incident ID:</span> ${res.incidentId}</p>` +
          `<p><span class="font-medium">Faces matched:</span> ${matches.length}</p>` +
          (matches.length
            ? matches
                .map(
                  (m) =>
                    `<div class="border border-slate-200 rounded-lg p-2">
                      ${m.matchedStudentName || "Unknown / Unregistered"}
                      ${m.matchedStudentClass ? " - " + m.matchedStudentClass : ""}
                      <span class="text-slate-400">(${confidencePercent(m.confidenceScore)}% confidence)</span>
                    </div>`
                )
                .join("")
            : `<p class="text-slate-400">No faces matched an enrolled student.</p>`);

        resultBox.classList.remove("hidden");
        showToast("Incident submitted for review");
        e.target.reset();
      } catch (err) {
        showToast(err.message, true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Upload & Analyze";
      }
    });
  </script>
</body>
</html>
