<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guidian AI - Scan Terminal</title>
  <script>(function(){try{document.documentElement.setAttribute('data-theme', localStorage.getItem('gd_theme')||'dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="theme.css" />
  <style>
    #viewport { position: relative; aspect-ratio: 16 / 10; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #feed-img { width: 100%; height: 100%; object-fit: contain; transition: transform 1.05s cubic-bezier(.45,0,.2,1); transform-origin: 50% 50%; }
    #live-video { width: 100%; height: 100%; object-fit: cover; }
    .corner-frame span { position: absolute; width: 22px; height: 22px; border: 1.5px solid var(--line-bright); }
    .corner-frame span.tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
    .corner-frame span.tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
    .corner-frame span.bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
    .corner-frame span.br { bottom: 10px; right: 10px; border-left: none; border-top: none; }
    #scan-sweep { position: absolute; left: 0; right: 0; height: 16%; background: linear-gradient(180deg, transparent, rgba(91,155,213,0.16), transparent); animation: scanline-sweep 1.8s linear infinite; pointer-events: none; }
    #hud-status { position: absolute; bottom: 14px; left: 16px; font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent); letter-spacing: .02em; }
    #live-indicator { position: absolute; top: 12px; left: 14px; display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 0.68rem; color: var(--green); }
    #live-indicator .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
    .mode-tab { background: transparent; border: none; color: var(--text-dim); font-family: var(--font-ui); font-size: 0.8rem; font-weight: 500; padding: 0.45rem 0.9rem; border-radius: 4px; cursor: pointer; }
    .mode-tab.active { background: var(--bg-panel-raised); color: var(--text); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <nav class="hud-nav">
    <div style="display:flex; align-items:center;">
      <span class="hud-brand"><span class="dot"></span>GUIDIAN AI</span>
      <div class="hud-nav-links">
        <span class="hud-link active">Scan Terminal</span>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:0.75rem;">
      <span id="user-label" class="hud-user"></span>
      <button id="theme-toggle-btn" class="hud-btn-logout">Light mode</button>
      <button onclick="logout()" class="hud-btn-logout">Logout</button>
    </div>
  </nav>

  <main class="hud-main">
    <div class="hud-panel" style="padding:1.1rem 1.4rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;">
      <div>
        <h1 class="hud-h1">Subject Intake</h1>
        <p class="hud-sub" id="mode-desc">Submit field footage for facial detection and cross-reference against the enrolled roster.</p>
      </div>
      <div id="mode-tabs" style="display:flex; gap:0.2rem; background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:3px;">
        <button data-mode="file" class="mode-tab active">File Upload</button>
        <button data-mode="live" class="mode-tab">Live Check</button>
      </div>
    </div>

    <div class="hud-panel" style="margin-top:1.25rem; overflow:hidden;">
      <div id="viewport">
        <!-- file mode: idle -->
        <div id="idle-state" style="text-align:center;">
          <input id="file-input" type="file" accept="image/*" hidden />
          <button id="pick-btn" class="hud-btn">Select Image</button>
          <p style="color:var(--text-dim); font-size:0.75rem; margin-top:0.9rem;">No file selected</p>
        </div>

        <!-- live mode: camera preview -->
        <div id="live-state" class="hidden" style="position:relative; width:100%; height:100%;">
          <video id="live-video" autoplay muted playsinline></video>
          <div id="live-indicator"><span class="dot"></span>CAMERA ACTIVE</div>
          <p id="live-hint" style="position:absolute; bottom:14px; left:16px; color:var(--text-dim); font-size:0.72rem; margin:0;">Point the camera and check whenever ready</p>
        </div>

        <!-- shared: captured/uploaded still + overlays -->
        <div id="feed-wrap" class="hidden" style="position:relative; width:100%; height:100%;">
          <img id="feed-img" alt="Submitted feed" />
          <div id="reticle-layer" style="position:absolute; inset:0; pointer-events:none;"></div>
          <div id="scan-sweep" class="hidden"></div>
          <div id="hud-status" class="hidden"></div>
        </div>

        <div class="corner-frame">
          <span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span>
        </div>
      </div>

      <div style="padding:0.9rem 1.25rem; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;">
        <div id="file-name" style="color:var(--text-dim); font-size:0.78rem;"></div>
        <div style="display:flex; gap:0.6rem;">
          <button id="reset-btn" class="hud-btn-ghost hidden">New Scan</button>
          <button id="resume-live-btn" class="hud-btn-ghost hidden">Resume Camera</button>
          <button id="check-btn" class="hud-btn hidden">Check Now</button>
          <button id="scan-btn" class="hud-btn hidden">Run Detection</button>
        </div>
      </div>
    </div>

    <div id="results-panel" class="hud-panel hidden flicker-in" style="margin-top:1.25rem;">
      <div class="hud-panel-title"><span id="results-title">Scan Report</span><span id="results-time" style="font-weight:400; text-transform:none;"></span></div>
      <div id="results-body" style="padding:1rem 1.25rem;"></div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    initThemeToggle();
    const session = requireRole("UPLOADER");
    document.getElementById("user-label").textContent = `${session.fullName} (${session.role})`;

    const idleState = document.getElementById("idle-state");
    const liveState = document.getElementById("live-state");
    const liveVideo = document.getElementById("live-video");
    const feedWrap = document.getElementById("feed-wrap");
    const feedImg = document.getElementById("feed-img");
    const reticleLayer = document.getElementById("reticle-layer");
    const scanSweep = document.getElementById("scan-sweep");
    const hudStatus = document.getElementById("hud-status");
    const fileInput = document.getElementById("file-input");
    const pickBtn = document.getElementById("pick-btn");
    const fileNameEl = document.getElementById("file-name");
    const scanBtn = document.getElementById("scan-btn");
    const checkBtn = document.getElementById("check-btn");
    const resetBtn = document.getElementById("reset-btn");
    const resumeLiveBtn = document.getElementById("resume-live-btn");
    const resultsPanel = document.getElementById("results-panel");
    const resultsBody = document.getElementById("results-body");
    const resultsTitle = document.getElementById("results-title");
    const resultsTime = document.getElementById("results-time");
    const modeDesc = document.getElementById("mode-desc");

    let mode = "file"; // "file" | "live"
    let selectedFile = null;
    let cameraStream = null;
    let statusTimer = null;

    const MODE_COPY = {
      file: "Submit field footage for facial detection and cross-reference against the enrolled roster. Creates a reviewable incident.",
      live: "Point the camera at a subject and check them against the roster instantly. Nothing is logged as an incident.",
    };

    function showOnly(el) {
      [idleState, liveState, feedWrap].forEach((e) => e.classList.add("hidden"));
      el.classList.remove("hidden");
    }

    function resetButtons() {
      [scanBtn, checkBtn, resetBtn, resumeLiveBtn].forEach((b) => b.classList.add("hidden"));
    }

    async function startCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        liveVideo.srcObject = cameraStream;
        showOnly(liveState);
        resetButtons();
        checkBtn.classList.remove("hidden");
        fileNameEl.textContent = "";
      } catch (err) {
        showToast("Camera access denied or unavailable.", true);
        setMode("file");
      }
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach((t) => t.stop());
        cameraStream = null;
      }
    }

    function setMode(next) {
      mode = next;
      modeDesc.textContent = MODE_COPY[mode];
      document.querySelectorAll(".mode-tab").forEach((btn) => btn.classList.toggle("active", btn.dataset.mode === mode));
      resultsPanel.classList.add("hidden");
      reticleLayer.innerHTML = "";
      feedImg.style.transform = "scale(1)";

      if (mode === "file") {
        stopCamera();
        selectedFile = null;
        fileInput.value = "";
        showOnly(idleState);
        resetButtons();
      } else {
        startCamera();
      }
    }

    document.querySelectorAll(".mode-tab").forEach((btn) =>
      btn.addEventListener("click", () => setMode(btn.dataset.mode))
    );

    pickBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      selectedFile = file;
      feedImg.src = URL.createObjectURL(file);
      fileNameEl.textContent = file.name;
      showOnly(feedWrap);
      resetButtons();
      scanBtn.classList.remove("hidden");
      reticleLayer.innerHTML = "";
      feedImg.style.transform = "scale(1)";
    });

    resetBtn.addEventListener("click", () => setMode("file"));

    resumeLiveBtn.addEventListener("click", () => {
      showOnly(liveState);
      resetButtons();
      checkBtn.classList.remove("hidden");
      resultsPanel.classList.add("hidden");
      reticleLayer.innerHTML = "";
    });

    function captureVideoFrame() {
      const canvas = document.createElement("canvas");
      canvas.width = liveVideo.videoWidth;
      canvas.height = liveVideo.videoHeight;
      canvas.getContext("2d").drawImage(liveVideo, 0, 0);
      return new Promise((resolve) => canvas.toBlob((blob) => resolve(blob), "image/jpeg", 0.92));
    }

    const HUD_PHRASES = [
      "Connecting to detection service...",
      "Locating facial regions...",
      "Extracting biometric features...",
      "Comparing against roster...",
      "Finalizing report...",
    ];

    function cycleStatus() {
      let i = 0;
      hudStatus.textContent = HUD_PHRASES[0];
      statusTimer = setInterval(() => {
        i = (i + 1) % HUD_PHRASES.length;
        hudStatus.textContent = HUD_PHRASES[i];
      }, 900);
    }

    function stopCycles() {
      clearInterval(statusTimer);
    }

    // Compute the on-screen rect of the (letterboxed) image content within #feed-img.
    function getRenderedImageRect() {
      const cw = feedImg.clientWidth, ch = feedImg.clientHeight;
      const nw = feedImg.naturalWidth, nh = feedImg.naturalHeight;
      const containerAspect = cw / ch, naturalAspect = nw / nh;
      let width, height, offsetX, offsetY;
      if (naturalAspect > containerAspect) {
        width = cw; height = cw / naturalAspect;
        offsetX = 0; offsetY = (ch - height) / 2;
      } else {
        height = ch; width = ch * naturalAspect;
        offsetY = 0; offsetX = (cw - width) / 2;
      }
      return { width, height, offsetX, offsetY, scale: width / nw };
    }

    function buildReticle(rect, id, label) {
      const div = document.createElement("div");
      div.className = "reticle state-processing";
      div.id = id;
      div.style.left = rect.left + "px";
      div.style.top = rect.top + "px";
      div.style.width = rect.width + "px";
      div.style.height = rect.height + "px";
      div.innerHTML =
        '<span class="reticle-corner tl"></span><span class="reticle-corner tr"></span>' +
        '<span class="reticle-corner bl"></span><span class="reticle-corner br"></span>' +
        '<span class="reticle-label">' + label + "</span>";
      reticleLayer.appendChild(div);
      return div;
    }

    function showIdCard(rect, match) {
      const card = document.createElement("div");
      const isMatch = !!match.matchedStudentId;
      card.className = "id-card flicker-in " + (isMatch ? "match" : "unknown");
      const left = Math.min(rect.left + rect.width + 14, feedWrap.clientWidth - 226);
      card.style.left = Math.max(8, left) + "px";
      card.style.top = Math.max(8, rect.top) + "px";
      card.innerHTML = isMatch
        ? `<div class="id-tag">Match Found</div>
           <div class="id-name">${match.matchedStudentName}</div>
           <div class="id-meta">${match.matchedStudentClass || "-"}</div>
           <div class="id-meta">Confidence ${confidencePercent(match.confidenceScore)}%</div>`
        : `<div class="id-tag">No Match</div>
           <div class="id-name">Unregistered subject</div>
           <div class="id-meta">Not found in roster</div>`;
      feedWrap.appendChild(card);
      return card;
    }

    async function runIdentificationSequence(matches) {
      const imgRect = getRenderedImageRect();

      const reticles = matches.map((m, idx) => {
        const box = m.faceBox;
        const rect = {
          left: imgRect.offsetX + box.x * imgRect.scale,
          top: imgRect.offsetY + box.y * imgRect.scale,
          width: box.width * imgRect.scale,
          height: box.height * imgRect.scale,
        };
        return { rect, match: m, el: buildReticle(rect, "reticle-" + idx, "Face " + (idx + 1)) };
      });

      await sleep(450);

      for (const r of reticles) {
        const isMatch = !!r.match.matchedStudentId;
        const centerXPct = ((r.rect.left + r.rect.width / 2) / feedImg.clientWidth) * 100;
        const centerYPct = ((r.rect.top + r.rect.height / 2) / feedImg.clientHeight) * 100;

        feedImg.style.transformOrigin = `${centerXPct}% ${centerYPct}%`;
        feedImg.style.transform = "scale(2.2)";
        r.el.style.zIndex = 5;

        await sleep(1000);
        const card = showIdCard(r.rect, r.match);
        await sleep(1400);

        r.el.classList.remove("state-processing");
        r.el.classList.add(isMatch ? "state-match" : "state-unknown");
        card.remove();
        feedImg.style.transform = "scale(1)";
        await sleep(800);
      }
    }

    function renderResults(matches, isLiveCheck, incidentId) {
      const identified = matches.filter((m) => m.matchedStudentId).length;
      resultsTitle.textContent = isLiveCheck ? "Live Check Result" : "Scan Report";
      resultsTime.textContent = new Date().toLocaleString();

      const summaryHtml = isLiveCheck
        ? `<div style="display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; margin-bottom:1rem;">
            <div><div class="hud-label" style="margin-bottom:3px;">Faces Detected</div><div>${matches.length}</div></div>
            <div><div class="hud-label" style="margin-bottom:3px;">Identified</div><div style="color:${identified > 0 ? "var(--green)" : "var(--text-dim)"};">${identified}</div></div>
          </div>`
        : `<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-bottom:1rem;">
            <div><div class="hud-label" style="margin-bottom:3px;">Incident ID</div><div style="font-family:var(--font-mono);">#${incidentId}</div></div>
            <div><div class="hud-label" style="margin-bottom:3px;">Faces Detected</div><div>${matches.length}</div></div>
            <div><div class="hud-label" style="margin-bottom:3px;">Identified</div><div style="color:${identified > 0 ? "var(--green)" : "var(--text-dim)"};">${identified}</div></div>
          </div>`;

      resultsBody.innerHTML =
        summaryHtml +
        (matches.length
          ? matches
              .map((m) => {
                const isMatch = !!m.matchedStudentId;
                return `<div style="display:flex; justify-content:space-between; align-items:center; padding:0.55rem 0; border-top:1px solid var(--line); font-size:0.85rem;">
                  <span style="color:${isMatch ? "var(--green)" : "var(--red)"};">${isMatch ? m.matchedStudentName : "Unregistered subject"}${m.matchedStudentClass ? " &middot; " + m.matchedStudentClass : ""}</span>
                  <span style="color:var(--text-dim); font-family:var(--font-mono); font-size:0.78rem;">${confidencePercent(m.confidenceScore)}%</span>
                </div>`;
              })
              .join("")
          : `<p style="color:var(--text-dim); font-size:0.85rem;">No faces detected.</p>`);

      resultsPanel.classList.remove("hidden");
    }

    async function runScan(endpoint, blob, filename, isLiveCheck) {
      resetButtons();
      resultsPanel.classList.add("hidden");
      scanSweep.classList.remove("hidden");
      hudStatus.classList.remove("hidden");
      cycleStatus();

      const formData = new FormData();
      formData.append("file", blob, filename);

      try {
        const [res] = await Promise.all([
          apiFetch(endpoint, { method: "POST", formData }),
          sleep(2200),
        ]);

        stopCycles();
        scanSweep.classList.add("hidden");
        hudStatus.classList.add("hidden");

        const matches = res.matches || [];
        if (matches.length > 0) {
          await runIdentificationSequence(matches);
        }

        renderResults(matches, isLiveCheck, res.incidentId);

        if (isLiveCheck) {
          resumeLiveBtn.classList.remove("hidden");
        } else {
          resetBtn.classList.remove("hidden");
          showToast("Incident #" + res.incidentId + " submitted for review");
        }
      } catch (err) {
        stopCycles();
        scanSweep.classList.add("hidden");
        hudStatus.classList.add("hidden");
        if (isLiveCheck) checkBtn.classList.remove("hidden");
        else scanBtn.classList.remove("hidden");
        showToast(err.message, true);
      }
    }

    scanBtn.addEventListener("click", () => {
      if (!selectedFile) return;
      runScan("/api/v1/incidents/upload", selectedFile, selectedFile.name, false);
    });

    checkBtn.addEventListener("click", async () => {
      const blob = await captureVideoFrame();
      feedImg.src = URL.createObjectURL(blob);
      showOnly(feedWrap);
      reticleLayer.innerHTML = "";
      feedImg.style.transform = "scale(1)";
      runScan("/api/v1/incidents/identify", blob, "livecheck.jpg", true);
    });

    window.addEventListener("beforeunload", stopCamera);
  </script>
</body>
</html>
