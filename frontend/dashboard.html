<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guidian AI - Incidents</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <nav class="bg-slate-900 text-white px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-8">
      <span class="font-bold">Guidian AI</span>
      <a href="dashboard.html" class="text-sm font-medium border-b-2 border-white pb-1">Dashboard</a>
      <a href="students.html" class="text-sm font-medium text-slate-300 hover:text-white">Students</a>
    </div>
    <div class="flex items-center gap-4 text-sm">
      <span id="user-label" class="text-slate-300"></span>
      <button onclick="logout()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg">Logout</button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-xl font-bold text-slate-900">Incidents</h1>
      <div id="tabs" class="flex gap-1 bg-slate-200 rounded-lg p-1">
        <button data-filter="ALL" class="tab-btn px-3 py-1.5 text-sm rounded-md font-medium">All</button>
        <button data-filter="PENDING" class="tab-btn px-3 py-1.5 text-sm rounded-md font-medium">Pending</button>
        <button data-filter="CONFIRMED" class="tab-btn px-3 py-1.5 text-sm rounded-md font-medium">Confirmed</button>
        <button data-filter="REJECTED" class="tab-btn px-3 py-1.5 text-sm rounded-md font-medium">Rejected</button>
      </div>
    </div>

    <div id="loading" class="text-sm text-slate-500">Loading incidents...</div>
    <div id="empty" class="hidden text-sm text-slate-500 bg-white border border-slate-200 rounded-lg p-8 text-center">No incidents found.</div>
    <div id="incident-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <script src="app.js"></script>
  <script>
    const session = requireRole("ADMIN");
    document.getElementById("user-label").textContent = `${session.fullName} (${session.role})`;

    let incidents = [];
    let activeFilter = "ALL";

    function applyTabStyles() {
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        const isActive = btn.dataset.filter === activeFilter;
        btn.classList.toggle("bg-white", isActive);
        btn.classList.toggle("shadow", isActive);
        btn.classList.toggle("text-slate-900", isActive);
        btn.classList.toggle("text-slate-600", !isActive);
      });
    }

    function matchLabel(match) {
      return `${match.studentName || "Unknown"}${match.studentClass ? " - " + match.studentClass : ""} (${confidencePercent(match.confidenceScore)}%)`;
    }

    function renderIncidents() {
      const grid = document.getElementById("incident-grid");
      const filtered = activeFilter === "ALL" ? incidents : incidents.filter((i) => i.status === activeFilter);

      document.getElementById("empty").classList.toggle("hidden", filtered.length > 0);
      grid.innerHTML = filtered
        .map((incident) => {
          const matches = incident.proposedMatches || [];
          const topMatch = matches[0];
          const optionsHtml = matches
            .map((m) => `<option value="${m.studentId}">${matchLabel(m)}</option>`)
            .join("");

          return `
            <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
              <img src="${mediaUrl(incident.mediaUrl)}" class="w-full h-48 object-cover bg-slate-100" onerror="this.style.display='none'" />
              <div class="p-4 space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-xs text-slate-500">${formatDate(incident.timestamp)}</span>
                  <span class="text-xs font-semibold border px-2 py-0.5 rounded-full ${statusBadgeClasses(incident.status)}">${incident.status}</span>
                </div>
                <p class="text-sm font-medium text-slate-900">
                  ${topMatch ? matchLabel(topMatch) : "No match proposed"}
                </p>

                ${
                  incident.status === "PENDING"
                    ? `
                  <div class="pt-2 border-t border-slate-100 space-y-2">
                    ${
                      matches.length > 0
                        ? `<select data-id="${incident.id}" class="confirm-select w-full text-sm border border-slate-300 rounded-lg px-2 py-1.5">${optionsHtml}</select>`
                        : `<p class="text-xs text-slate-400">No enrolled student matched.</p>`
                    }
                    <div class="flex gap-2">
                      <button data-id="${incident.id}" class="confirm-btn flex-1 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-lg py-1.5" ${matches.length === 0 ? "disabled" : ""}>Confirm</button>
                      <button data-id="${incident.id}" class="reject-btn flex-1 bg-red-600 hover:bg-red-700 text-white text-sm font-medium rounded-lg py-1.5">Reject</button>
                    </div>
                  </div>`
                    : `<p class="text-xs text-slate-400 pt-2 border-t border-slate-100">Reviewed ${formatDate(incident.reviewedAt)}</p>`
                }
              </div>
            </div>`;
        })
        .join("");

      grid.querySelectorAll(".confirm-btn").forEach((btn) =>
        btn.addEventListener("click", () => confirmIncident(btn.dataset.id))
      );
      grid.querySelectorAll(".reject-btn").forEach((btn) =>
        btn.addEventListener("click", () => rejectIncident(btn.dataset.id))
      );
    }

    async function confirmIncident(id) {
      const select = document.querySelector(`.confirm-select[data-id="${id}"]`);
      const studentId = select ? select.value : null;
      if (!studentId) return showToast("No student to confirm.", true);
      try {
        await apiFetch(`/api/v1/incidents/${id}/confirm`, { method: "POST", body: { studentId: Number(studentId) } });
        showToast("Incident confirmed");
        await loadIncidents();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    async function rejectIncident(id) {
      const reason = prompt("Reason for rejecting this incident:");
      if (!reason) return;
      try {
        await apiFetch(`/api/v1/incidents/${id}/reject`, { method: "POST", body: { reason } });
        showToast("Incident rejected");
        await loadIncidents();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    async function loadIncidents() {
      try {
        incidents = await apiFetch("/api/v1/incidents");
        incidents.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        document.getElementById("loading").classList.add("hidden");
        renderIncidents();
      } catch (err) {
        document.getElementById("loading").textContent = "Failed to load incidents: " + err.message;
      }
    }

    document.querySelectorAll(".tab-btn").forEach((btn) =>
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.filter;
        applyTabStyles();
        renderIncidents();
      })
    );

    applyTabStyles();
    loadIncidents();
    setInterval(loadIncidents, 15000); // periodic refresh, no full page reload
  </script>
</body>
</html>
