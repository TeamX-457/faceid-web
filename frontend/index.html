<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guidian AI - Sign In</title>
  <script>(function(){try{document.documentElement.setAttribute('data-theme', localStorage.getItem('gd_theme')||'dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="theme.css" />
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; position:relative;">
  <button id="theme-toggle-btn" class="hud-btn-logout" style="position:absolute; top:1.25rem; right:1.25rem;">Light mode</button>
  <div class="hud-panel" style="width:100%; max-width:360px; padding:2rem;">
    <div style="text-align:center; margin-bottom:1.75rem;">
      <div class="hud-brand" style="font-size:1rem; display:flex; align-items:center; justify-content:center;"><span class="dot"></span>GUIDIAN AI</div>
      <p class="hud-sub" style="margin-top:0.5rem;">Campus Security Console</p>
    </div>

    <form id="login-form" style="display:flex; flex-direction:column; gap:1rem;">
      <div>
        <label class="hud-label" for="username">Username</label>
        <input id="username" type="text" required autocomplete="username" class="hud-input" style="margin-top:0.35rem;" />
      </div>
      <div>
        <label class="hud-label" for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" class="hud-input" style="margin-top:0.35rem;" />
      </div>

      <div id="error-box" class="hidden" style="font-size:0.8rem; color:var(--red); background:rgba(217,83,79,0.1); border:1px solid var(--red); border-radius:4px; padding:0.6rem 0.75rem;"></div>

      <button id="submit-btn" type="submit" class="hud-btn" style="width:100%; padding:0.65rem;">
        Sign In
      </button>
    </form>

    <p style="font-size:0.7rem; color:var(--text-dim); text-align:center; margin-top:1.5rem;">Admin: admin / admin123 &middot; Uploader: uploader / uploader123</p>
  </div>

  <script src="app.js"></script>
  <script>
    initThemeToggle();

    if (getSession().token) {
      window.location.href = getSession().role === "ADMIN" ? "dashboard.html" : "upload.html";
    }

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error-box");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in...";

      try {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const res = await apiFetch("/auth/login", { method: "POST", body: { username, password } });
        setSession({ token: res.token, role: res.role, username: res.username, fullName: res.full_name });
        window.location.href = res.role === "ADMIN" ? "dashboard.html" : "upload.html";
      } catch (err) {
        errorBox.textContent = err.message || "Login failed";
        errorBox.classList.remove("hidden");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
