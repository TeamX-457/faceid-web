<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guidian AI - Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm bg-white rounded-xl shadow-xl p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-900">Guidian AI</h1>
      <p class="text-sm text-slate-500 mt-1">FaceID Campus Security Dashboard</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input id="username" type="text" required autocomplete="username"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input id="password" type="password" required autocomplete="current-password"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
      </div>

      <div id="error-box" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>

      <button id="submit-btn" type="submit"
        class="w-full bg-slate-900 text-white rounded-lg py-2 text-sm font-semibold hover:bg-slate-800 transition">
        Sign In
      </button>
    </form>

    <p class="text-xs text-slate-400 text-center mt-6">Admin: admin / admin123 &middot; Uploader: uploader / uploader123</p>
  </div>

  <script src="app.js"></script>
  <script>
    if (getSession().token) {
      window.location.href = getSession().role === "ADMIN" ? "dashboard.html" : "upload.html";
    }

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error-box");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in...";

      try {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const res = await apiFetch("/auth/login", { method: "POST", body: { username, password } });
        setSession({ token: res.token, role: res.role, username: res.username, fullName: res.fullName });
        window.location.href = res.role === "ADMIN" ? "dashboard.html" : "upload.html";
      } catch (err) {
        errorBox.textContent = err.message || "Login failed";
        errorBox.classList.remove("hidden");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
