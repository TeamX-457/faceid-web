spring.application.name=faceid-campus-backend

# App Server Config
server.port=8080

# Python Microservice URL (for face detection and embedding)
app.ai.python-service-url=${PYTHON_SERVICE_URL:http://localhost:8001}

# Upload Path
app.upload.dir=uploads/

# PostgreSQL Connection Properties (Neon managed Postgres - see .env)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Multipart Config
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB